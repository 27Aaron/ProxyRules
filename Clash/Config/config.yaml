    url: "https://github.com/27Aaron/ProxyRules/raw/main/Clash/Rules/Anthropic/Anthropic.yaml"
    path: "./ruleset/Anthropic.yaml"
  IP-Attribution:
    <<: *rule_providers_classical
    url: "https://github.com/27Aaron/ProxyRules/raw/main/Clash/Rules/IP-Attribution/IP-Attribution.yaml"
    path: "./ruleset/IP-Attribution.yaml"

rules:
  # > SSH
  - DST-PORT,22,Manual

  # > Private
  - RULE-SET,private,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # > APNs
  - RULE-SET,APNs,Manual

  # > Apple Intelligence
  - RULE-SET,Apple-Intelligence,AI

  # > xAI / Grok
  - RULE-SET,xAI,AI

  # > OpenAI / ChatGPT / Sora
  - RULE-SET,OpenAI,AI

  # > GitHub Copilot
  - RULE-SET,GitHub-Copilot,AI

  # > Gemini / Google AI
  - RULE-SET,Gemini,AI

  # > Anthropic / Claude
  - RULE-SET,Anthropic,AI

  # > IP Attribution
  - RULE-SET,IP-Attribution,IP-Attribution

  # > Block foreign QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn),(RULE-SET,cn_ip,no-resolve)))))),REJECT

  # > Direct (CN services)
  - RULE-SET,games_cn,Direct
  - RULE-SET,epicgames,Direct
  - RULE-SET,nvidia_cn,Direct
  - RULE-SET,apple_cn,Direct
  - RULE-SET,microsoft_cn,Direct

  # > Services
  - RULE-SET,youtube,Google
  - RULE-SET,GoogleFCM,Google
  - RULE-SET,googlefcm,Google
  - RULE-SET,google,Google
  - RULE-SET,apple,Apple
  - RULE-SET,telegram,Telegram
  - RULE-SET,twitter,Twitter

  # > Services (IP)
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,twitter_ip,Twitter,no-resolve

  # > Fallback
  - RULE-SET,gfw,Proxies
  - RULE-SET,geolocation-cn,Direct
  - RULE-SET,cn_ip,Direct,no-resolve
  - MATCH,Final
