mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
bind-address: "*"
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 30
keep-alive-interval: 15
find-process-mode: strict
authentication: ["mihomo:27Aaron"]
skip-auth-prefixes: [127.0.0.1/8, "::1/128"]

external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 127.0.0.1:9090
secret: 27Aaron
profile: {store-selected: true, store-fake-ip: true}

sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com", "captive.apple.com"]

ntp:
  enable: true
  write-to-system: false
  server: "ntp.aliyun.com"
  port: 123
  interval: 60

tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ["any:53", "tcp://any:53"]
  # > Route exclude
  route-exclude-address:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 255.255.255.255/32
    - ::1/128
    - fc00::/7
    - fe80::/10
    - ff00::/8
    - ::ffff:0:0:0:0/96

chinaDNS: &chinaDNS ["https://dns.alidns.com/dns-query#DIRECT", "https://doh.pub/dns-query#DIRECT"]
foreignDNS: &foreignDNS ["https://dns.cloudflare.com/dns-query#Proxies", "https://dns.google/dns-query#Proxies"]

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # > Fake-IP filter
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:fakeip_filter"
  proxy-server-nameserver: *chinaDNS
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver: *foreignDNS
  nameserver-policy:
    "rule-set:cn": *chinaDNS
  direct-nameserver: ["system", "223.5.5.5", "119.29.29.29"]

hosts:
  "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]
  "services.googleapis.cn": ["services.googleapis.com"]
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]
  "+.edge.mountaintoys.cn": ["0.0.0.0"]
  "+.h2.smtcdns.net": ["0.0.0.0"]

proxy-providers:
  Sub:
    type: http
    url: "https://sub.store/download/collection/AIO?target=ClashMeta"
    interval: 3600
    path: ./providers/Sub.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 3000
      lazy: true

group_common:
  select: &group_select
    type: select
    interval: 600
    timeout: 3000
    max-failed-times: 3
    url: http://cp.cloudflare.com/generate_204
    lazy: true

  url-test: &group_url_test
    type: url-test
    interval: 300
    timeout: 3000
    max-failed-times: 3
    empty-fallback: REJECT
    url: http://cp.cloudflare.com/generate_204
    lazy: true
    tolerance: 20
    include-all: true
    exclude-type: DIRECT
    hidden: true

proxy-groups:
  # > Main
  - name: Proxies
    <<: *group_select
    proxies: [Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/Orz-3/mini/raw/master/Color/Global.png

  - name: Manual
    <<: *group_select
    include-all: true
    icon: https://raw.githubusercontent.com/shindgew/WHATSINStash/main/icon/fallback.png

  - name: AI
    <<: *group_select
    proxies: [Manual, JPN, SGP, TWN, USA]
    icon: https://github.com/Orz-3/mini/raw/master/Color/OpenAI.png

  - name: Google
    <<: *group_select
    proxies: [Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/Orz-3/mini/raw/master/Color/Google.png

  - name: Apple
    <<: *group_select
    proxies: [DIRECT, Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/Orz-3/mini/raw/master/Color/Apple.png

  - name: Telegram
    <<: *group_select
    proxies: [Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/Orz-3/mini/raw/master/Color/Telegram.png

  - name: Twitter
    <<: *group_select
    proxies: [Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/x.png

  - name: IP-Attribution
    <<: *group_select
    proxies: [DIRECT, Manual, HKG, JPN, SGP, TWN, USA]
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/obeliscodebuenosaires.png

  - name: Direct
    <<: *group_select
    proxies: [DIRECT, Proxies, Manual]
    icon: https://github.com/blackmatrix7/ios_rule_script/raw/master/icon/qure/color/Direct.png

  - name: Final
    <<: *group_select
    proxies: [Proxies, Direct, Manual]
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Final.png

  # > Regions
  - name: HKG
    <<: *group_url_test
    filter: '(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/HK.png

  - name: JPN
    <<: *group_url_test
    filter: '(?i)(🇯🇵|日本|Japan|\bJPN\b|\bJP\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/JP.png

  - name: SGP
    <<: *group_url_test
    filter: '(?i)(🇸🇬|新加坡|Singapore|\bSGP\b|\bSG\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/SG.png

  - name: TWN
    <<: *group_url_test
    filter: '(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/TW.png

  - name: USA
    <<: *group_url_test
    filter: '(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/US.png

rule_providers_common:
  rule_providers_domain: &rule_providers_domain {type: http, format: mrs, interval: 86400, behavior: domain}
  rule_providers_ip: &rule_providers_ip {type: http, format: mrs, interval: 86400, behavior: ipcidr}
  rule_providers_classical: &rule_providers_classical {type: http, format: yaml, interval: 86400, behavior: classical}

# > Rule providers
