mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
bind-address: "*"
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 30
keep-alive-interval: 15
find-process-mode: strict
authentication: ["mihomo:27Aaron"]
skip-auth-prefixes: [127.0.0.1/8, "::1/128"]

external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 127.0.0.1:9090
secret: 27Aaron
profile: {store-selected: true, store-fake-ip: true}

sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com", "captive.apple.com"]

ntp:
  enable: true
  write-to-system: false
  server: "ntp.aliyun.com"
  port: 123
  interval: 60

tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ["any:53", "tcp://any:53"]
  route-exclude-address:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 255.255.255.255/32
    - ::1/128
    - fc00::/7
    - fe80::/10
    - ff00::/8
    - ::ffff:0:0:0:0/96

chinaDNS: &chinaDNS ["https://dns.alidns.com/dns-query#DIRECT", "https://doh.pub/dns-query#DIRECT"]
foreignDNS: &foreignDNS ["https://dns.cloudflare.com/dns-query#Proxies", "https://dns.google/dns-query#Proxies"]

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "rule-set:private"
  proxy-server-nameserver: *chinaDNS
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver: *foreignDNS
  nameserver-policy:
    "rule-set:cn": *chinaDNS
  direct-nameserver: ["system", "223.5.5.5", "119.29.29.29"]

hosts:
  "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]
  "services.googleapis.cn": ["services.googleapis.com"]
group_common:
  url-test: &group_url_test
    type: url-test
    interval: 300
    timeout: 3000
    max-failed-times: 3
    empty-fallback: REJECT
    url: http://cp.cloudflare.com/generate_204
    lazy: true
    tolerance: 20
    include-all: true
    exclude-type: DIRECT
    hidden: true

  url-test-group: &group_url_test_group
    type: url-test
    interval: 300
    timeout: 3000
    max-failed-times: 3
    empty-fallback: REJECT
    url: http://cp.cloudflare.com/generate_204
    lazy: true
    tolerance: 20
    hidden: true

  select: &group_select
    type: select
    url: http://cp.cloudflare.com/generate_204
    lazy: true

proxy-groups:
  # > Manual
  - name: Manual
    <<: *group_select
    include-all: true
    icon: https://raw.githubusercontent.com/shindgew/WHATSINStash/main/icon/fallback.png

  # > AI
  - name: AI
    <<: *group_select
    proxies: [Manual, JP, US]
    icon: https://github.com/Orz-3/mini/raw/master/Color/OpenAI.png

  # > Proxies
  - name: Proxies
    <<: *group_select
    proxies: [Manual, HK, JP, US]
    icon: https://github.com/Orz-3/mini/raw/master/Color/Global.png

  # > Regions
  - name: HK
    <<: *group_url_test
    filter: '(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/HK.png
    hidden: true

  - name: JP
    <<: *group_url_test
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/JP.png
    hidden: true

  - name: US
    <<: *group_url_test
    filter: '(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)'
    icon: https://github.com/Orz-3/mini/raw/master/Color/US.png
    hidden: true

rule_providers_common:
  domain: &rule_provider_domain {type: http, format: mrs, interval: 86400, behavior: domain}
  ip: &rule_provider_ip {type: http, format: mrs, interval: 86400, behavior: ipcidr}
  text: &rule_provider_text {type: http, format: text, interval: 86400, behavior: classical}
  yaml: &rule_provider_yaml {type: http, format: yaml, interval: 86400, behavior: classical}

rule-providers:
  # > Ads
  category-ads-all@ads:
    <<: *rule_provider_text
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list"
    path: "./ruleset/category-ads-all@ads.list"

  # > Private
  private:
    <<: *rule_provider_domain
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
    path: "./ruleset/private.mrs"
  private-ip:
    <<: *rule_provider_ip
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"
    path: "./ruleset/private-ip.mrs"

  # > Proxy
  proxy:
    <<: *rule_provider_domain
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs"
    path: "./ruleset/geolocation-!cn.mrs"

  # > Direct CN
  cn:
    <<: *rule_provider_domain
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
    path: "./ruleset/cn.mrs"
  cn-ip:
    <<: *rule_provider_ip
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
    path: "./ruleset/cn-ip.mrs"

  # > AI (self-hosted curated lists)
  Anthropic:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.yaml"
    path: "./ruleset/anthropic.yaml"
  AppleAI:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.yaml"
    path: "./ruleset/appleai.yaml"
  Gemini:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.yaml"
    path: "./ruleset/gemini.yaml"
  GitHubCopilot:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.yaml"
    path: "./ruleset/githubcopilot.yaml"
  OpenAI:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.yaml"
    path: "./ruleset/openai.yaml"
  XAI:
    <<: *rule_provider_yaml
    url: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.yaml"
    path: "./ruleset/xai.yaml"

rules:
  # > Ads
  - RULE-SET,category-ads-all@ads,REJECT

  # > Private
  - RULE-SET,private,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve

  # > AI
  - RULE-SET,Anthropic,AI
  - RULE-SET,AppleAI,AI
  - RULE-SET,Gemini,AI
  - RULE-SET,GitHubCopilot,AI
  - RULE-SET,OpenAI,AI
  - RULE-SET,XAI,AI

  # > Direct CN
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve

  # > Proxy fallback
  - RULE-SET,proxy,Proxies

  # > Final
  - MATCH,Proxies
