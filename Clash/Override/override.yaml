mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
bind-address: "*"
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 30
keep-alive-interval: 15
find-process-mode: strict
authentication: ["mihomo:27Aaron"]
skip-auth-prefixes: [127.0.0.1/8, "::1/128"]

external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 127.0.0.1:9090
secret: 27Aaron
profile: { store-selected: true, store-fake-ip: true }

sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

ntp:
  enable: true
  write-to-system: false
  server: "ntp.aliyun.com"
  port: 123
  interval: 60

tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ["any:53", "tcp://any:53"]

chinaDNS:
  &chinaDNS [
    "https://dns.alidns.com/dns-query#DIRECT",
    "https://doh.pub/dns-query#DIRECT",
  ]
foreignDNS:
  &foreignDNS [
    "https://dns.cloudflare.com/dns-query#Proxies",
    "https://dns.google/dns-query#Proxies",
  ]

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ["rule-set:private", "rule-set:fakeip_filter"]
  proxy-server-nameserver: *chinaDNS
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver: *foreignDNS
  nameserver-policy:
    "rule-set:cn": *chinaDNS
  direct-nameserver: ["system", "223.5.5.5", "119.29.29.29"]

hosts:
  "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]

  # 解决谷歌商店无法下载的问题
  "services.googleapis.cn": ["services.googleapis.com"]

  # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿/直播问题
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]
  "+.edge.mountaintoys.cn": ["0.0.0.0"]
  "+.h2.smtcdns.net": ["0.0.0.0"]

# 策略组通用配置
group_common:
  select: &group_select
    type: select
    interval: 600
    timeout: 3000
    max-failed-times: 3
    url: http://cp.cloudflare.com/generate_204
    lazy: true

  url-test: &group_url_test
    type: url-test
    interval: 300
    timeout: 3000
    max-failed-times: 3
    empty-fallback: REJECT
    url: http://cp.cloudflare.com/generate_204
    lazy: true
    tolerance: 20
    include-all: true
    exclude-type: DIRECT
    hidden: true

proxy-groups:
  - name: Proxies
    <<: *group_select
    proxies:
      [
        手动选择,
        自动选择,
        香港自动,
        日本自动,
        美国自动,
        香港节点,
        日本节点,
        美国节点,
      ]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

  - name: AI
    <<: *group_select
    proxies: [日本节点, 美国节点, 日本自动, 美国自动]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png

  - name: Google
    <<: *group_select
    proxies:
      [Proxies, 香港节点, 日本节点, 美国节点, 香港自动, 日本自动, 美国自动]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png

  - name: Telegram
    <<: *group_select
    proxies:
      [Proxies, 香港节点, 日本节点, 美国节点, 香港自动, 日本自动, 美国自动]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png

  - name: Twitter
    <<: *group_select
    proxies:
      [Proxies, 香港节点, 日本节点, 美国节点, 香港自动, 日本自动, 美国自动]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png

  - name: 手动选择
    <<: *group_select
    include-all: true
    exclude-type: DIRECT
    icon: https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png

  - name: 香港节点
    <<: *group_select
    include-all: true
    exclude-type: DIRECT
    filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong)'
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - name: 日本节点
    <<: *group_select
    include-all: true
    exclude-type: DIRECT
    filter: "(?i)(🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan)"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - name: 美国节点
    <<: *group_select
    include-all: true
    exclude-type: DIRECT
    filter: "(?i)(🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|america|united\\s*states)"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

  - name: Direct
    <<: *group_select
    proxies: [DIRECT, Proxies]
    icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Direct.png

  - name: Final
    <<: *group_select
    proxies: [Proxies, Direct]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

  - name: 自动选择
    <<: *group_url_test
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png

  - name: 香港自动
    <<: *group_url_test
    filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong)'
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - name: 日本自动
    <<: *group_url_test
    filter: "(?i)(🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan)"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - name: 美国自动
    <<: *group_url_test
    filter: "(?i)(🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|america|united\\s*states)"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

rule_providers_common:
  rule_providers_domain:
    &rule_providers_domain {
      type: http,
      format: mrs,
      interval: 86400,
      behavior: domain,
    }
  rule_providers_ip:
    &rule_providers_ip {
      type: http,
      format: mrs,
      interval: 86400,
      behavior: ipcidr,
    }

