# Regenerate Rules meta headers when rule *bodies* change.
# Body unchanged → skip (no UPDATED churn). Bot commit uses [skip ci].
name: Rule headers

on:
  push:
    branches: [main, master]
    paths:
      - "**/Rules/**/*.list"
      - "**/Rules/**/*.yaml"
      - ".github/scripts/update-rule-headers.py"
      - ".github/workflows/rule-headers.yml"

concurrency:
  group: rule-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update headers (body-changed files only)
        run: python3 .github/scripts/update-rule-headers.py

      - name: Commit and push if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No header changes to commit."
            exit 0
          fi

          git add -- \
            Clash/Rules \
            Surge/Rules \
            Loon/Rules \
            Shadowrocket/Rules

          if git diff --staged --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "chore(rules): refresh rule headers [skip ci]"
          git push
