name: Maintain main branch

on:
  push:
    branches: [main]
    paths:
      - "**/*.conf"
      - "**/*.list"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/package.json"
      - ".github/package-lock.json"
      - ".github/scripts/format-repo.py"
      - ".github/scripts/install-ci-tools.sh"
      - ".github/scripts/update-config-headers.py"
      - ".github/scripts/update-rule-headers.py"
      - ".github/scripts/validate-maintenance-diff.py"
      - ".github/scripts/tests/test_format_repo.py"
      - ".github/scripts/tests/test_update_rule_headers.py"
      - ".github/scripts/tests/test_validate_maintenance_diff.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintain-main
  cancel-in-progress: true

jobs:
  maintain:
    name: Format files and refresh headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install maintenance tools
        working-directory: .github
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./scripts/install-ci-tools.sh "${RUNNER_TEMP}/tools" prettier yamlfmt

      - name: Test maintenance scripts
        run: |
          python3 .github/scripts/tests/test_format_repo.py
          python3 .github/scripts/tests/test_update_rule_headers.py
          python3 .github/scripts/tests/test_validate_maintenance_diff.py

      - name: Format repository
        env:
          CI: "true"
        run: |
          export PATH="${RUNNER_TEMP}/tools:${PATH}"
          python3 .github/scripts/format-repo.py

      - name: Refresh metadata headers
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 .github/scripts/update-rule-headers.py
            python3 .github/scripts/update-config-headers.py
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && \
            git rev-parse --verify --quiet --end-of-options \
              "${BASE_SHA}^{commit}" > /dev/null; then
            python3 .github/scripts/update-rule-headers.py --base "$BASE_SHA"
            python3 .github/scripts/update-config-headers.py --base "$BASE_SHA"
          else
            echo "Push base is unavailable; refreshing every header."
            python3 .github/scripts/update-rule-headers.py --all
            python3 .github/scripts/update-config-headers.py --all
          fi

      - name: Validate and stage maintenance changes
        id: changes
        run: |
          python3 .github/scripts/validate-maintenance-diff.py
          if git diff --quiet --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add --update
          git diff --cached --check
          git diff --exit-code
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push maintenance changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply repository maintenance"
          test -z "$(git status --porcelain)"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:${GITHUB_REF}"
