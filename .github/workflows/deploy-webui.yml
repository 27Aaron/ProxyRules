name: Deploy WebUI

on:
  push:
    branches:
      - webui
    paths:
      - ".github/workflows/deploy-webui.yml"
      - "web/**"
  workflow_dispatch:

concurrency:
  group: webui-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: web/package.json
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test and lint
        working-directory: web
        run: |
          pnpm test
          pnpm lint

      - name: Build WebUI
        working-directory: web
        env:
          ASTRO_BASE_PATH: /ProxyRules/
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
