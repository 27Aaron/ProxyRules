name: Update generated rules

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build-generated-rules.py"
      - ".github/scripts/compile-mrs.go"
      - ".github/scripts/prepare-custom-rules.py"
      - ".github/scripts/tests/test_build_generated_rules.py"
      - ".github/scripts/tests/test_prepare_custom_rules.py"
      - ".github/workflows/update-generated-rules.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Allow publishing when more than 5% of categories disappear
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: generated-rules-rules
  cancel-in-progress: false

env:
  CONVERTER_REPOSITORY: MetaCubeX/meta-rules-converter
  CONVERTER_SHA: 7dea27841a3579a633189830c98c08a0434e8b79
  SOURCE_REPOSITORY: v2fly/domain-list-community
  GEOIP_SOURCE_REPOSITORY: Loyalsoldier/geoip
  CUSTOM_SOURCE_REF: custom
  TARGET_BRANCH: rules

jobs:
  generate:
    name: Generate and publish rules branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout generator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test generator
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Checkout custom rules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CUSTOM_SOURCE_REF }}
          path: custom-source
          fetch-depth: 1
          persist-credentials: false

      - name: Read latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          source_tag="$(gh api "repos/${SOURCE_REPOSITORY}/releases/latest" --jq '.tag_name')"
          [[ "$source_tag" =~ ^[0-9A-Za-z._-]+$ ]]
          source_commit="$(gh api "repos/${SOURCE_REPOSITORY}/commits/${source_tag}" --jq '.sha')"
          source_published_at="$(gh api "repos/${SOURCE_REPOSITORY}/releases/latest" --jq '.published_at')"
          geoip_source_tag="$(gh api "repos/${GEOIP_SOURCE_REPOSITORY}/releases/latest" --jq '.tag_name')"
          [[ "$geoip_source_tag" =~ ^[0-9A-Za-z._-]+$ ]]
          geoip_source_commit="$(gh api "repos/${GEOIP_SOURCE_REPOSITORY}/commits/${geoip_source_tag}" --jq '.sha')"
          geoip_source_published_at="$(gh api "repos/${GEOIP_SOURCE_REPOSITORY}/releases/latest" --jq '.published_at')"
          custom_source_dir="${GITHUB_WORKSPACE}/custom-source"
          custom_source_commit="$(git -C "$custom_source_dir" rev-parse HEAD)"
          custom_source_published_at="$(git -C "$custom_source_dir" show -s --format=%cI HEAD)"

          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$geoip_source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$custom_source_commit" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "SOURCE_TAG=$source_tag"
            echo "SOURCE_COMMIT=$source_commit"
            echo "SOURCE_PUBLISHED_AT=$source_published_at"
            echo "GEOIP_SOURCE_TAG=$geoip_source_tag"
            echo "GEOIP_SOURCE_COMMIT=$geoip_source_commit"
            echo "GEOIP_SOURCE_PUBLISHED_AT=$geoip_source_published_at"
            echo "CUSTOM_SOURCE_COMMIT=$custom_source_commit"
            echo "CUSTOM_SOURCE_PUBLISHED_AT=$custom_source_published_at"
          } >> "$GITHUB_ENV"

      - name: Download and verify source data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          input_dir="${RUNNER_TEMP}/rules-input"
          mkdir -p "$input_dir"
          gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern dlc.dat \
            --pattern dlc.dat.sha256sum \
            --dir "$input_dir"
          gh release download "$GEOIP_SOURCE_TAG" \
            --repo "$GEOIP_SOURCE_REPOSITORY" \
            --pattern geoip.dat \
            --pattern geoip.dat.sha256sum \
            --dir "$input_dir"
          (
            cd "$input_dir"
            sha256sum --check --strict --quiet dlc.dat.sha256sum
            sha256sum --check --strict --quiet geoip.dat.sha256sum
          )

      - name: Build pinned converter
        shell: bash
        run: |
          set -euo pipefail

          converter_dir="${RUNNER_TEMP}/meta-rules-converter"
          git clone --quiet --filter=blob:none --no-checkout \
            "https://github.com/${CONVERTER_REPOSITORY}.git" "$converter_dir"
          git -C "$converter_dir" fetch --quiet --depth=1 origin "$CONVERTER_SHA"
          git -C "$converter_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$converter_dir" rev-parse HEAD)" = "$CONVERTER_SHA"
          mkdir -p "${RUNNER_TEMP}/bin"
          (
            cd "$converter_dir"
            go build -trimpath -o "${RUNNER_TEMP}/bin/meta-rules-converter" ./
          )
          helper_dir="$converter_dir/cmd/proxyrules-compile-mrs"
          mkdir -p "$helper_dir"
          cp "${GITHUB_WORKSPACE}/.github/scripts/compile-mrs.go" \
            "$helper_dir/main.go"
          (
            cd "$converter_dir"
            go build -trimpath -o "${RUNNER_TEMP}/bin/compile-mrs" \
              ./cmd/proxyrules-compile-mrs
          )

      - name: Convert geosite sections
        shell: bash
        run: |
          set -euo pipefail

          converted_dir="${RUNNER_TEMP}/converted-geosite"
          "${RUNNER_TEMP}/bin/meta-rules-converter" geosite \
            --file "${RUNNER_TEMP}/rules-input/dlc.dat" \
            --out "$converted_dir"

          sing_dir="${RUNNER_TEMP}/converted-geosite-sing"
          "${RUNNER_TEMP}/bin/meta-rules-converter" geosite \
            --file "${RUNNER_TEMP}/rules-input/dlc.dat" \
            --out "$sing_dir" \
            --type sing-box

      - name: Convert GeoIP sections
        shell: bash
        run: |
          set -euo pipefail

          converted_dir="${RUNNER_TEMP}/converted-geoip"
          "${RUNNER_TEMP}/bin/meta-rules-converter" geoip \
            --file "${RUNNER_TEMP}/rules-input/geoip.dat" \
            --out "$converted_dir"

          sing_dir="${RUNNER_TEMP}/converted-geoip-sing"
          "${RUNNER_TEMP}/bin/meta-rules-converter" geoip \
            --file "${RUNNER_TEMP}/rules-input/geoip.dat" \
            --out "$sing_dir" \
            --type sing-box

      - name: Prepare and compile custom rules
        shell: bash
        run: |
          set -euo pipefail

          prepared_dir="${RUNNER_TEMP}/prepared-custom"
          python3 .github/scripts/prepare-custom-rules.py \
            --custom-dir "${GITHUB_WORKSPACE}/custom-source" \
            --geosite-classical-dir "${RUNNER_TEMP}/converted-geosite/classical" \
            --geoip-dir "${RUNNER_TEMP}/converted-geoip" \
            --output-dir "$prepared_dir" \
            --minimum-categories 5 \
            --required-category anthropic \
            --required-category apple-push \
            --required-category googlefcm \
            --required-category ip-attribution \
            --required-category openai

          compiled_dir="${RUNNER_TEMP}/compiled-custom"
          "${RUNNER_TEMP}/bin/meta-rules-converter" clash \
            --file "$prepared_dir/geosite/classical" \
            --out "$compiled_dir/geosite" \
            --type sing-box
          "${RUNNER_TEMP}/bin/meta-rules-converter" clash \
            --file "$prepared_dir/geoip/classical" \
            --out "$compiled_dir/geoip" \
            --type sing-box
          "${RUNNER_TEMP}/bin/meta-rules-converter" clash \
            --file "$prepared_dir/ruleset" \
            --out "$compiled_dir/ruleset" \
            --type sing-box

          mkdir -p "$prepared_dir/ruleset-srs"
          while IFS= read -r name; do
            cp "$prepared_dir/geosite/domain/${name}.list" \
              "${RUNNER_TEMP}/converted-geosite/${name}.list"
            cp "$prepared_dir/geosite/domain/${name}.yaml" \
              "${RUNNER_TEMP}/converted-geosite/${name}.yaml"
            cp "$prepared_dir/geosite/classical/${name}.list" \
              "${RUNNER_TEMP}/converted-geosite/classical/${name}.list"
            cp "$prepared_dir/geosite/classical/${name}.yaml" \
              "${RUNNER_TEMP}/converted-geosite/classical/${name}.yaml"
            "${RUNNER_TEMP}/bin/compile-mrs" \
              --behavior domain \
              --input "$prepared_dir/geosite/domain/${name}.list" \
              --output "${RUNNER_TEMP}/converted-geosite/${name}.mrs"
            cp "$compiled_dir/geosite/${name}/domain.srs" \
              "${RUNNER_TEMP}/converted-geosite-sing/${name}.srs"

            cp "$prepared_dir/geoip/${name}.list" \
              "${RUNNER_TEMP}/converted-geoip/${name}.list"
            cp "$prepared_dir/geoip/${name}.yaml" \
              "${RUNNER_TEMP}/converted-geoip/${name}.yaml"
            "${RUNNER_TEMP}/bin/compile-mrs" \
              --behavior ipcidr \
              --input "$prepared_dir/geoip/${name}.list" \
              --output "${RUNNER_TEMP}/converted-geoip/${name}.mrs"
            cp "$compiled_dir/geoip/${name}/ip.srs" \
              "${RUNNER_TEMP}/converted-geoip-sing/${name}.srs"

          done < <(jq -r '.categories | keys[]' "$prepared_dir/metadata.json")
          while IFS= read -r name; do
            cp "$compiled_dir/ruleset/${name}/classical.srs" \
              "$prepared_dir/ruleset-srs/${name}.srs"
          done < <(jq -r '.rulesets | keys[]' "$prepared_dir/metadata.json")

      - name: Fetch previous rules branch when available
        shell: bash
        run: |
          set -euo pipefail

          previous_dir="${RUNNER_TEMP}/rules-previous"
          public_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          branch_ref="$(git ls-remote --heads "$public_remote" \
            "refs/heads/${TARGET_BRANCH}")"
          if [[ -n "$branch_ref" ]]; then
            previous_sha="${branch_ref%%$'\t'*}"
            [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
            git clone --quiet --depth=1 --branch "$TARGET_BRANCH" \
              "$public_remote" "$previous_dir"
          else
            previous_sha=""
            mkdir -p "$previous_dir"
          fi
          {
            echo "PREVIOUS_DIR=$previous_dir"
            echo "PREVIOUS_SHA=$previous_sha"
          } >> "$GITHUB_ENV"

      - name: Package category-first rules
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/rules-output"
          arguments=(
            --domain-dir "${RUNNER_TEMP}/converted-geosite"
            --classical-dir "${RUNNER_TEMP}/converted-geosite/classical"
            --srs-dir "${RUNNER_TEMP}/converted-geosite-sing"
            --geoip-dir "${RUNNER_TEMP}/converted-geoip"
            --geoip-srs-dir "${RUNNER_TEMP}/converted-geoip-sing"
            --ruleset-dir "${RUNNER_TEMP}/prepared-custom/ruleset"
            --ruleset-srs-dir "${RUNNER_TEMP}/prepared-custom/ruleset-srs"
            --output-dir "$output_dir"
            --previous-dir "$PREVIOUS_DIR"
            --repository "$GITHUB_REPOSITORY"
            --branch "$TARGET_BRANCH"
            --source-repository "$SOURCE_REPOSITORY"
            --source-release "$SOURCE_TAG"
            --source-commit "$SOURCE_COMMIT"
            --source-published-at "$SOURCE_PUBLISHED_AT"
            --geoip-source-repository "$GEOIP_SOURCE_REPOSITORY"
            --geoip-source-release "$GEOIP_SOURCE_TAG"
            --geoip-source-commit "$GEOIP_SOURCE_COMMIT"
            --geoip-source-published-at "$GEOIP_SOURCE_PUBLISHED_AT"
            --custom-source-repository "$GITHUB_REPOSITORY"
            --custom-source-ref "$CUSTOM_SOURCE_REF"
            --custom-source-commit "$CUSTOM_SOURCE_COMMIT"
            --custom-source-published-at "$CUSTOM_SOURCE_PUBLISHED_AT"
            --converter-repository "$CONVERTER_REPOSITORY"
            --converter-commit "$CONVERTER_SHA"
            --minimum-categories 1000
            --minimum-geoip-categories 250
            --minimum-ruleset-categories 7
            --alias "360=qihoo360"
            --required-category 115
            --required-category 360
            --required-category netflix
            --required-category cn
            --required-category 'geolocation-!cn'
            --required-category anthropic
            --required-category apple-push
            --required-category googlefcm
            --required-category ip-attribution
            --required-category openai
            --required-geoip-category cn
            --required-geoip-category private
            --required-geoip-category us
            --required-geoip-category anthropic
            --required-geoip-category apple-push
            --required-geoip-category googlefcm
            --required-geoip-category ip-attribution
            --required-geoip-category openai
            --required-ruleset-category anthropic
            --required-ruleset-category apple-push
            --required-ruleset-category googlefcm
            --required-ruleset-category ip-attribution
            --required-ruleset-category ip-attribution-direct
            --required-ruleset-category ip-attribution-reject
            --required-ruleset-category openai
          )
          while IFS= read -r name; do
            arguments+=(--custom-category "$name")
          done < <(
            jq -r '.categories | keys[]' \
              "${RUNNER_TEMP}/prepared-custom/metadata.json"
          )
          if [[ "${{ inputs.allow_large_drop || false }}" == "true" ]]; then
            arguments+=(--allow-large-drop)
          fi
          python3 .github/scripts/build-generated-rules.py "${arguments[@]}"

      - name: Validate generated tree
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/rules-output"
          (
            cd "$output_dir"
            sha256sum --check --strict --quiet SHA256SUMS
          )
          test -s "$output_dir/geosite/115/115.list"
          test -s "$output_dir/geosite/115/115.yaml"
          test -s "$output_dir/geosite/115/115.mrs"
          test -s "$output_dir/geosite/115/115.srs"
          test -s "$output_dir/geosite/360/360.list"
          test -s "$output_dir/geosite/360/360.mrs"
          test -s "$output_dir/geosite/360/360.srs"
          test -s "$output_dir/geosite/netflix/netflix.yaml"
          grep -Fqx 'DOMAIN-SUFFIX,115.com' \
            "$output_dir/geosite/115/115.list"
          grep -Fqx "  - 'DOMAIN-SUFFIX,115.com'" \
            "$output_dir/geosite/115/115.yaml"
          test -s "$output_dir/geoip/cn/cn.list"
          test -s "$output_dir/geoip/cn/cn.yaml"
          test -s "$output_dir/geoip/cn/cn.mrs"
          test -s "$output_dir/geoip/cn/cn.srs"
          test -s "$output_dir/geoip/private/private.list"
          test -s "$output_dir/geoip/us/us.srs"
          grep -Eq '^IP-CIDR,[^,]+,no-resolve$' \
            "$output_dir/geoip/cn/cn.list"
          grep -Eq '^IP-CIDR6,[^,]+,no-resolve$' \
            "$output_dir/geoip/cn/cn.list"
          for name in anthropic apple-push googlefcm ip-attribution openai; do
            test -s "$output_dir/geosite/$name/$name.list"
            test -s "$output_dir/geosite/$name/$name.yaml"
            test -s "$output_dir/geosite/$name/$name.mrs"
            test -s "$output_dir/geosite/$name/$name.srs"
            test -s "$output_dir/geoip/$name/$name.list"
            test -s "$output_dir/geoip/$name/$name.yaml"
            test -s "$output_dir/geoip/$name/$name.mrs"
            test -s "$output_dir/geoip/$name/$name.srs"
            test -s "$output_dir/ruleset/$name/$name.list"
            test -s "$output_dir/ruleset/$name/$name.yaml"
            test -s "$output_dir/ruleset/$name/$name.srs"
            test ! -e "$output_dir/ruleset/$name/$name.mrs"
          done
          grep -Fqx 'DOMAIN-SUFFIX,anthropic.com' \
            "$output_dir/geosite/anthropic/anthropic.list"
          grep -Fqx 'IP-CIDR,160.79.104.0/21,no-resolve' \
            "$output_dir/geoip/anthropic/anthropic.list"
          grep -Fqx 'DOMAIN-SUFFIX,anthropic.com' \
            "$output_dir/ruleset/anthropic/anthropic.list"
          grep -Fqx 'IP-CIDR,160.79.104.0/21,no-resolve' \
            "$output_dir/ruleset/anthropic/anthropic.list"
          if grep -Eq ',(DIRECT|REJECT)(,|$)' \
            "$output_dir/ruleset/ip-attribution/ip-attribution.list"; then
            exit 1
          fi
          for name in ip-attribution-direct ip-attribution-reject; do
            test -s "$output_dir/ruleset/ip-attribution/$name.list"
            test -s "$output_dir/ruleset/ip-attribution/$name.yaml"
            test -s "$output_dir/ruleset/ip-attribution/$name.srs"
            test ! -e "$output_dir/ruleset/ip-attribution/$name.mrs"
            if grep -Eq ',(DIRECT|REJECT)(,|$)' \
              "$output_dir/ruleset/ip-attribution/$name.list"; then
              exit 1
            fi
          done
          test "$(grep -Ec '^[A-Z0-9-]+,' \
            "$output_dir/ruleset/ip-attribution/ip-attribution.list")" -eq 189
          test "$(grep -Ec '^[A-Z0-9-]+,' \
            "$output_dir/ruleset/ip-attribution/ip-attribution-direct.list")" -eq 24
          test "$(grep -Ec '^[A-Z0-9-]+,' \
            "$output_dir/ruleset/ip-attribution/ip-attribution-reject.list")" -eq 20

      - name: Stage generated branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/rules-output"
          if [[ -n "$PREVIOUS_SHA" ]]; then
            if diff --recursive --brief --exclude=.git \
              "$output_dir" "$PREVIOUS_DIR" > /dev/null; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              diff_status=$?
              if ((diff_status > 1)); then
                exit "$diff_status"
              fi
            fi
          fi

          publish_dir="${RUNNER_TEMP}/rules-publish"
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --quiet --initial-branch="$TARGET_BRANCH"
          rsync -a "$output_dir/" "$publish_dir/"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" diff --cached --check
          echo "PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push rules branch
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        shell: bash
        run: |-
          set -euo pipefail

          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          commit_time="$(date '+%Y-%m-%d %H:%M:%S UTC+08:00')"
          git -C "$PUBLISH_DIR" commit --quiet \
            -m "chore(rules): update ${commit_time}"
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          push_options=()
          if [[ -n "$PREVIOUS_SHA" ]]; then
            push_options+=(
              "--force-with-lease=refs/heads/${TARGET_BRANCH}:${PREVIOUS_SHA}"
            )
          fi
          git -C "$PUBLISH_DIR" push "${push_options[@]}" "$authenticated_remote" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
