name: Validate automation

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/rules-generation.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validation tools
        run: .github/scripts/install-lint-tools.sh "${RUNNER_TEMP}/tools"

      - name: Test automation scripts
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Lint workflows and shell scripts
        run: |
          "${RUNNER_TEMP}/tools/actionlint" \
            -shellcheck "${RUNNER_TEMP}/tools/shellcheck"
          "${RUNNER_TEMP}/tools/shellcheck" \
            .github/scripts/install-lint-tools.sh \
            .github/scripts/validate-generated-rules.sh
