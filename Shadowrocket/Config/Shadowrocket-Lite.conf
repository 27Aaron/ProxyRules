[General]
# > IPv6 / System
ipv6 = true
bypass-system = true

# > skip-proxy / TUN exclude
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, localhost, *.local, captive.apple.com, e.crashlytics.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
fallback-dns-server = 8.8.8.8, 1.1.1.1
doh-server = https://doh.pub/dns-query
private-ip-answer = true
always-reject-url-rewrite = false
hijack-dns = 8.8.8.8:53, 1.1.1.1:53

# > Other
udp-policy-not-supported-behaviour = reject
test-timeout = 3
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204

[Proxy Group]
# > AI
AI = url-test, JP, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, hidden=1

# > Proxies
Proxies = url-test, HK, JP, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, hidden=1

# > Regions
HK = url-test, include-all-proxies=true, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b), hidden=1
JP = url-test, include-all-proxies=true, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇯🇵|日本|Japan|\bJPN\b|\bJP\b), hidden=1
US = url-test, include-all-proxies=true, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b), hidden=1

[Rule]
# > Ads
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,REJECT

# > Private
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,DIRECT

# > AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.list,AI

# > Proxy
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list,Proxies

# > Direct CN
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list,DIRECT

# > Final
FINAL,Proxies

[Host]

[URL Rewrite]

[MITM]
enable = false
hostname =
