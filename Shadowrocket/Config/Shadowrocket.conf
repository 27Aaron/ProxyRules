[General]
# > IPv6 / System
ipv6 = true
bypass-system = true

# > skip-proxy / TUN exclude
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, localhost, *.local, captive.apple.com, e.crashlytics.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
fallback-dns-server = 8.8.8.8, 1.1.1.1
doh-server = https://doh.pub/dns-query
private-ip-answer = true
always-reject-url-rewrite = false
hijack-dns = 8.8.8.8:53, 1.1.1.1:53

# > Other
udp-policy-not-supported-behaviour = reject
test-timeout = 3
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204

[Proxy]
DIRECT = direct
REJECT = reject

[Proxy Group]
# > Subscription
Sub = select, policy-path=https://sub.store/download/collection/AIO?target=Shadowrocket, update-interval=3600, hidden=1, include-all-proxies=0

# > AI
AI = select, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=600

# > Google
Google = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Proxies
Proxies = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Telegram
Telegram = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Twitter
Twitter = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Regions
HK = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)
JP = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇯🇵|日本|Japan|\bJPN\b|\bJP\b)
KR = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇰🇷|韩国|韓國|Korea|\bKOR\b|\bKR\b)
SG = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇸🇬|新加坡|Singapore|\bSGP\b|\bSG\b)
TW = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)
US = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)

[Rule]
# > LAN
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,DIRECT

# > AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.list,AI

# > Services
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/ApplePush/ApplePush.list,Proxies
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GoogleFCM/GoogleFCM.list,Google
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list,Twitter

# > Proxy
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list,Proxies

# > Direct CN
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list,DIRECT

# > Final
FINAL,Proxies

[Host]
localhost = 127.0.0.1

[URL Rewrite]

[MITM]
enable = false
hostname =
