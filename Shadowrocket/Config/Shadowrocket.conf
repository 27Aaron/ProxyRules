[General]
# > IPv6 / System
ipv6 = true
bypass-system = true

# > skip-proxy / TUN exclude
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, localhost, *.local, captive.apple.com, e.crashlytics.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
fallback-dns-server = 8.8.8.8, 1.1.1.1
doh-server = https://doh.pub/dns-query
private-ip-answer = true
always-reject-url-rewrite = false
hijack-dns = 8.8.8.8:53, 1.1.1.1:53

# > Other
udp-policy-not-supported-behaviour = reject
test-timeout = 3
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204

[Proxy]
DIRECT = direct
REJECT = reject

[Proxy Group]
# > Subscription
Sub = select, policy-path=https://sub.store/download/collection/AIO?target=Shadowrocket, update-interval=3600, hidden=1, include-all-proxies=0

# > Main
Proxies = select, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Manual = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=600
AI = select, Manual, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Google = select, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Apple = select, DIRECT, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Telegram = select, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Twitter = select, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
IP-Attribution = select, DIRECT, Manual, HKG, JPN, SGP, TWN, USA, url=http://cp.cloudflare.com/generate_204, interval=600
Direct = select, DIRECT, Proxies, Manual, url=http://wifi.vivo.com.cn/generate_204, interval=600
Final = select, Proxies, Direct, Manual, url=http://cp.cloudflare.com/generate_204, interval=600

# > Regions
HKG = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)
JPN = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇯🇵|日本|Japan|\bJPN\b|\bJP\b)
SGP = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇸🇬|新加坡|Singapore|\bSGP\b|\bSG\b)
TWN = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)
USA = url-test, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20, policy-regex-filter=(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)

[Rule]
# > LAN
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/private/private.list,DIRECT

# > AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/apple-intelligence/apple-intelligence.list,AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/xai/xai.list,AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/openai/openai.list,AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/github-copilot/github-copilot.list,AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/google-gemini/google-gemini.list,AI
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/anthropic/anthropic.list,AI

# > Services
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/apple-push/apple-push.list,Manual
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/ip-attribution/ip-attribution-reject.list,REJECT
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/ip-attribution/ip-attribution-direct.list,DIRECT
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/ip-attribution/ip-attribution.list,IP-Attribution
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/googlefcm/googlefcm.list,Google
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/youtube/youtube.list,Google
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/google/google.list,Google
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/apple/apple.list,Apple
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/telegram/telegram.list,Telegram
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/twitter/twitter.list,Twitter

# > Proxy
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/geolocation-!cn/geolocation-!cn.list,Proxies

# > Direct CN
RULE-SET,https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/cn/cn.list,DIRECT

# > Final
FINAL,Final

[Host]
localhost = 127.0.0.1

[URL Rewrite]

[MITM]
enable = false
hostname =
