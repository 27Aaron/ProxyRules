# REPO: https://github.com/27Aaron/ProxyRules
# LINK: https://github.com/27Aaron/ProxyRules/raw/refs/heads/main/Egern/Config/Egern-Lite.yaml
# -----------------------------------------------------

close_connections_on_policy_change: true
proxy_latency_test_url: "http://cp.cloudflare.com/generate_204"
direct_latency_test_url: "http://wifi.vivo.com.cn/generate_204"
geoip_db_url: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
hijack_dns:
  - "*:53"
auto_update:
  url: "https://github.com/27Aaron/ProxyRules/raw/refs/heads/main/Egern/Config/Egern-Lite.yaml"
  interval: 86400

ipv6: true
http_port: 7890
socks_port: 7891

dns:
  bootstrap:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4
  upstreams:
    china:
      - "https://dns.alidns.com/dns-query"
      - "https://doh.onedns.net/dns-query"
    foreign:
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
  proxy_nameservers:
    - 223.5.5.5
    - 119.29.29.29

  forward:
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
        value: REJECT
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/cn.yaml"
        value: china
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/proxy.yaml"
        value: foreign
    - domain_wildcard:
        match: "*"
        value: foreign

hosts:
  "dns.alidns.com":
    - "223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1"
  "doh.pub":
    - "1.12.12.12, 120.53.53.53"
  "dns.cloudflare.com":
    - "104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9"
  "dns.google":
    - "8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844"

policy_groups:
  # > Manual
  - external:
      name: Manual
      type: select

  # > AI
  - select:
      name: AI
      policies:
        - Manual
        - JP
        - US

  # > Proxies
  - select:
      name: Proxies
      policies:
        - Manual
        - HK
        - JP
        - US

  # > Regions
  - external:
      name: HK
      type: auto_test
      filter: '(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)'
      interval: 300
      tolerance: 20
      hidden: true
  - external:
      name: JP
      type: auto_test
      filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)'
      interval: 300
      tolerance: 20
      hidden: true
  - external:
      name: US
      type: auto_test
      filter: '(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)'
      interval: 300
      tolerance: 20
      hidden: true

rules:
  # > Ads
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
      policy: REJECT

  # > LAN
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT

  # > AI (self-hosted curated lists)
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.egern.yaml"
      policy: AI

  # > Proxy
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy.yaml"
      policy: Proxies

  # > Direct CN
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/China/China.yaml"
      policy: DIRECT
  - geoip:
      match: CN
      policy: DIRECT

  # > Final
  - default:
      policy: Proxies
