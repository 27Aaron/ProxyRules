policy_groups:
  # > AI
  - select:
      name: AI
      policies:
        - Manual
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/ChatGPT.png"

  # > Google
  - select:
      name: Google
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Google_Search.png"

  # > Telegram
  - select:
      name: Telegram
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Telegram.png"

  # > Twitter
  - select:
      name: Twitter
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Twitter.png"

  # > Proxies
  - select:
      name: Proxies
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Proxy.png"

  # > Manual(全部节点)
  - external:
      name: Manual
      type: select
      icon: "https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png"

  # > Regions(从 Manual 节点池自动派生)
  - auto_test:
      name: HK
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Hong_Kong.png"

  - auto_test:
      name: JP
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Japan.png"

  - auto_test:
      name: KR
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul|\bKOR\b|\bKR\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Korea.png"

  - auto_test:
      name: SG
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇸🇬|新加坡|狮城|Singapore|\bSGP\b|\bSG\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Singapore.png"

  - auto_test:
      name: TW
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Taiwan.png"

  - auto_test:
      name: US
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)"
      interval: 300
      tolerance: 20
      hidden: true
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/United_States.png"

rules:
  # > LAN
  - rule_set:
      match: "https://github.com/Repcz/Tool/raw/X/Egern/Rules/Lan.yaml"
      policy: DIRECT

  # > Ads
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
      policy: REJECT

  # > AI (self-hosted curated lists)
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.egern.yaml"
      policy: AI

  # > Services
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml"
      policy: Google
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml"
      policy: Telegram
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml"
      policy: Twitter

  # > Proxy
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy.yaml"
      policy: Proxies

  # > Direct CN
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/China/China.yaml"
      policy: DIRECT
  - geoip:
      match: CN
      policy: DIRECT

  # > Final
  - default:
      policy: Proxies
