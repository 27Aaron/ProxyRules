close_connections_on_policy_change: true
proxy_latency_test_url: "http://cp.cloudflare.com/generate_204"
direct_latency_test_url: "http://wifi.vivo.com.cn/generate_204"
geoip_db_url: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
hijack_dns:
  - "*:53"
auto_update:
  url: "https://github.com/27Aaron/ProxyRules/raw/refs/heads/main/Egern/Config/Egern.yaml"
  interval: 86400

ipv6: true
http_port: 6152
socks_port: 6153

dns:
  bootstrap:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4
  upstreams:
    china:
      - "https://dns.alidns.com/dns-query"
      - "https://doh.onedns.net/dns-query"
    foreign:
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
  hosts:
    "dns.alidns.com":
    - "223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1"
    "doh.pub":
    - "1.12.12.12, 120.53.53.53"
    "dns.cloudflare.com":
    - "104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9"
    "dns.google":
    - "8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844"
  proxy_nameservers:
    - 223.5.5.5
    - 52.80.66.66

  forward:
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
        value: REJECT
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/cn.yaml"
        value: china
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/proxy.yaml"
        value: foreign
    - domain_wildcard:
        match: "*"
        value: foreign

policy_groups:
  # > AI
  - select:
      name: AI
      policies:
        - Manual
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/ChatGPT.png"

  # > Google
  - select:
      name: Google
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Google_Search.png"

  # > Telegram
  - select:
      name: Telegram
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Telegram.png"

  # > Twitter
  - select:
      name: Twitter
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Twitter.png"

  # > Proxies
  - select:
      name: Proxies
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Proxy.png"

  # > Manual(全部节点)
  - external:
      name: Manual
      type: select
      icon: "https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png"

  # > Regions(从 Manual 节点池自动派生)
  - auto_test:
      name: HK
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Hong_Kong.png"

  - auto_test:
      name: JP
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Japan.png"

  - auto_test:
      name: KR
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul|\bKOR\b|\bKR\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Korea.png"

  - auto_test:
      name: SG
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇸🇬|新加坡|狮城|Singapore|\bSGP\b|\bSG\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Singapore.png"

  - auto_test:
      name: TW
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/Taiwan.png"

  - auto_test:
      name: US
      policies:
        - Manual
      flatten: true
      filter: "(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)"
      interval: 300
      tolerance: 20
      icon: "https://github.com/Koolson/Qure/raw/master/IconSet/Color/United_States.png"

rules:
  # > LAN
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT

  # > Ads
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
      policy: REJECT

  # > AI (self-hosted curated lists)
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.egern.yaml"
      policy: AI

  # > Services
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml"
      policy: Google
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml"
      policy: Telegram
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml"
      policy: Twitter

  # > Proxy
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy.yaml"
      policy: Proxies

  # > Direct CN
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/China/China.yaml"
      policy: DIRECT
  - geoip:
      match: CN
      policy: DIRECT

  # > Final
  - default:
      policy: Proxies
