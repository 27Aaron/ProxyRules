# UPDATED: 2026-11-19 16:06:23
# REPO: https://github.com/27Aaron/ProxyRules
# LINK: https://github.com/27Aaron/ProxyRules/raw/refs/heads/main/Egern/Config/Egern.yaml
# -----------------------------------------------------

close_connections_on_policy_change: true
proxy_latency_test_url: "http://cp.cloudflare.com/generate_204"
direct_latency_test_url: "http://wifi.vivo.com.cn/generate_204"
geoip_db_url: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
hijack_dns:
  - "*:53"
auto_update:
  url: "https://github.com/27Aaron/ProxyRules/raw/refs/heads/main/Egern/Config/Egern.yaml"
  interval: 86400

ipv6: true
http_port: 7890
socks_port: 7891

dns:
  bootstrap:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4
  upstreams:
    china:
      - "https://dns.alidns.com/dns-query"
      - "https://doh.onedns.net/dns-query"
    foreign:
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
  proxy_nameservers:
    - 223.5.5.5
    - 119.29.29.29

  forward:
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
        value: REJECT
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/cn.yaml"
        value: china
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/proxy.yaml"
        value: foreign
    - domain_wildcard:
        match: "*"
        value: foreign

hosts:
  "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]

policy_groups:
  # > Manual (all nodes)
  - external:
      name: Manual
      type: select

  # > AI
  - select:
      name: AI
      policies:
        - Manual
        - JP
        - KR
        - SG
        - TW
        - US

  # > Google
  - select:
      name: Google
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US

  # > Proxies
  - select:
      name: Proxies
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US

  # > Telegram
  - select:
      name: Telegram
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US

  # > Twitter
  - select:
      name: Twitter
      policies:
        - Manual
        - HK
        - JP
        - KR
        - SG
        - TW
        - US

  # > Regions
  - external:
      name: HK
      type: auto_test
      filter: '(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)'
      interval: 300
      tolerance: 20
  - external:
      name: JP
      type: auto_test
      filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)'
      interval: 300
      tolerance: 20
  - external:
      name: KR
      type: auto_test
      filter: '(?i)(🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul|\bKOR\b|\bKR\b)'
      interval: 300
      tolerance: 20
  - external:
      name: SG
      type: auto_test
      filter: '(?i)(🇸🇬|新加坡|狮城|Singapore|\bSGP\b|\bSG\b)'
      interval: 300
      tolerance: 20
  - external:
      name: TW
      type: auto_test
      filter: '(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)'
      interval: 300
      tolerance: 20
  - external:
      name: US
      type: auto_test
      filter: '(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)'
      interval: 300
      tolerance: 20

rules:
  # > LAN
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT

  # > Ads
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Advertising/Advertising.yaml"
      policy: REJECT

  # > AI (self-hosted curated lists)
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.egern.yaml"
      policy: AI
  - rule_set:
      match: "https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.egern.yaml"
      policy: AI

  # > Services
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml"
      policy: Google
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml"
      policy: Telegram
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml"
      policy: Twitter

  # > Proxy
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy.yaml"
      policy: Proxies

  # > Direct CN
  - rule_set:
      match: "https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/China/China.yaml"
      policy: DIRECT
  - geoip:
      match: CN
      policy: DIRECT

  # > Final
  - default:
      policy: Proxies
