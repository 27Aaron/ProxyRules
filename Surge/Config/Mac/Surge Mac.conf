[General]
# > log level
loglevel = notify
show-error-page-for-reject = true

# > test url
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 3

# > GeoIP
geoip-maxmind-url = https://github.com/Loyalsoldier/geoip/raw/release/Country.mmdb

# > Ipv6 support
ipv6 = true
ipv6-vif = auto

# > http & socks5 server
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153

# > Web Dashboard
http-api-web-dashboard = true
http-api = Aaron@0.0.0.0:6171
http-api-tls = false

# > skip-proxy
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96, localhost, *.local, captive.apple.com, e.crashlytics.com

# > Dns
dns-server = system, 114.114.114.114, 119.29.29.29, 223.5.5.5, 223.6.6.6
encrypted-dns-server = https://doh.pub/dns-query
hijack-dns = 8.8.8.8:53, 1.1.1.1:53, 8.8.4.4:53
encrypted-dns-follow-outbound-mode = true

# > Other
udp-priority = true
compatibility-mode = 0
exclude-simple-hostnames = true
udp-policy-not-supported-behaviour = reject
always-real-ip = *.lan, *.id.ui.direct, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, global.turn.twilio.com, global.stun.twilio.com, localhost.*.qq.com, localhost.*.weixin.qq.com, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, music.163.com, *.music.163.com, *.126.net, musicapi.taihe.com, music.taihe.com, songsearch.kugou.com, trackercdn.kugou.com, *.kuwo.cn, api-jooxtt.sanook.com, api.joox.com, joox.com, y.qq.com, *.y.qq.com, streamoc.music.tc.qq.com, mobileoc.music.tc.qq.com, isure.stream.qqmusic.qq.com, dl.stream.qqmusic.qq.com, aqqmusic.tc.qq.com, amobile.music.tc.qq.com, *.xiami.com, *.music.migu.cn, music.migu.cn, proxy.golang.org, *.mcdn.bilivideo.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*
always-raw-tcp-hosts = www.google.com, 91.108.56.*, 91.108.4.*, 91.108.8.*, 91.108.16.*, 91.108.12.*, 149.154.16*, 149.154.17*, 91.108.20.*, 185.76.151.*, 91.105.192.*, 5.28.19*

[Proxy]
# > Built-in
Direct = direct
Reject = reject

[Proxy Group]
# > Subscription
Sub = select, hidden=1, policy-path=https://sub.store/download/collection/AIO, update-interval=3600, no-alert=0, include-all-proxies=0

# > AI
AI = select, JP, KR, SG, TW, US

# > Google
Google = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Proxies
Proxies = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Telegram
Telegram = url-test, HK, JP, KR, SG, TW, US, url=http://cp.cloudflare.com/generate_204, interval=300, tolerance=20

# > Regions
HK = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b, evaluate-before-use=true
JP = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇯🇵|日本|Japan|\bJPN\b|\bJP\b, evaluate-before-use=true
KR = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇰🇷|韩国|韓國|Korea|\bKOR\b|\bKR\b, evaluate-before-use=true
SG = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇸🇬|新加坡|Singapore|\bSGP\b|\bSG\b, evaluate-before-use=true
TW = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b, evaluate-before-use=true
US = select, include-all-proxies=true, include-other-group=Sub, url=http://cp.cloudflare.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=(?i)🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b, evaluate-before-use=true

[Rule]
# > AD & Privacy
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,Reject

# > LAN
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,Direct

# > AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.list,AI
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.list,AI

# > Services
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/ApplePush/ApplePush.list,Proxies
RULE-SET,https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GoogleFCM/GoogleFCM.list,Google
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram

# > Proxy
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list,Proxies

# > Direct CN
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list,Direct

# > Final
FINAL,Proxies,dns-failed
