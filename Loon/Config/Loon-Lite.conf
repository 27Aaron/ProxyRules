[General]
# > Interface
ip-mode = dual
interface-mode = auto

# > skip-proxy / bypass-tun
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96, localhost, *.local, captive.apple.com, e.crashlytics.com
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
doh-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
hijack-dns = 8.8.8.8:53, 1.1.1.1:53, 8.8.4.4:53
dns-reject-mode = LOOPBACKIP
domain-reject-mode = DNS

# > Test URL
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 3

# > Other
allow-udp-proxy = true
udp-fallback-mode = REJECT
sni-sniffing = true

# > GeoIP / Parser
geoip-url = https://github.com/Loyalsoldier/geoip/raw/release/Country-without-asn.mmdb
ipasn-url = https://github.com/Loyalsoldier/geoip/raw/release/GeoLite2-ASN.mmdb

[Proxy]

[Remote Proxy]

[Proxy Group]
# > Main
Proxies = select,Manual,HKG,JPN,USA,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Global.png
Manual = select,ALL_Filter,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://raw.githubusercontent.com/shindgew/WHATSINStash/main/icon/fallback.png
Google = select,Proxies,Manual,HKG,JPN,USA,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Google.png
Twitter = select,Proxies,Manual,HKG,JPN,USA,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/x.png
Final = select,Proxies,DIRECT,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Koolson/Qure/raw/master/IconSet/Color/Final.png

# > Regions
HKG = url-test,HKG_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 20,img-url = https://github.com/Orz-3/mini/raw/master/Color/HK.png
JPN = url-test,JPN_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 20,img-url = https://github.com/Orz-3/mini/raw/master/Color/JP.png
USA = url-test,USA_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 20,img-url = https://github.com/Orz-3/mini/raw/master/Color/US.png

[Remote Filter]
# > All
ALL_Filter = NameRegex, FilterKey = ".*"

# > Regions
HKG_Filter = NameRegex, FilterKey = "(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)"
JPN_Filter = NameRegex, FilterKey = "(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)"
USA_Filter = NameRegex, FilterKey = "(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)"

[Remote Rule]
# > Reject
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/category-ads-all@ads/category-ads-all@ads.list, policy=REJECT, tag=Reject, enabled=true

# > Private
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/private/private.list, policy=DIRECT, tag=Private, enabled=true

# > Google
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/google/google.list, policy=Google, tag=Google, enabled=true

# > Twitter
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/twitter/twitter.list, policy=Twitter, tag=Twitter, enabled=true

# > Proxy
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/geolocation-!cn/geolocation-!cn.list, policy=Proxies, tag=Proxy, enabled=true

# > Direct CN
https://fastly.jsdelivr.net/gh/27Aaron/ProxyRules@rules/ruleset/cn/cn.list, policy=DIRECT, tag=CN, enabled=true

[Rule]
# > Final
FINAL,Final

[Rewrite]

[Script]

[MITM]
hostname =
ca-p12 =
ca-passphrase =
skip-server-cert-verify = false
