[General]
# > Interface
ip-mode = dual
interface-mode = auto

# > skip-proxy / bypass-tun
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96, localhost, *.local, captive.apple.com, e.crashlytics.com
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
doh-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
hijack-dns = 8.8.8.8:53, 1.1.1.1:53, 8.8.4.4:53
dns-reject-mode = LOOPBACKIP
domain-reject-mode = DNS

# > Test URL
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 3

# > Other
allow-udp-proxy = true
udp-fallback-mode = REJECT
sni-sniffing = true

# > GeoIP / Parser
geoip-url = https://github.com/Loyalsoldier/geoip/raw/release/Country-without-asn.mmdb
ipasn-url = https://github.com/Loyalsoldier/geoip/raw/release/GeoLite2-ASN.mmdb
resource-parser = https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js

[Proxy]

[Remote Proxy]

[Proxy Group]
# > Main
Proxies = select,Auto,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Global.png
AI = select,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/OpenAI.png
Apple = select,DIRECT,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Apple.png
Google = select,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Google.png
Twitter = select,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/x.png
Telegram = select,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/Telegram.png
IP-Attribution = select,DIRECT,HKG,JPN,SGP,TWN,USA,Manual,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/obeliscodebuenosaires.png

# > Auto / Select
Auto = url-test,ALL_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/Auto.png
Manual = select,ALL_Filter,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/fallback.png

# > Regions
HKG = url-test,HKG_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/HK.png
JPN = url-test,JPN_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/JP.png
SGP = url-test,SGP_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/SG.png
TWN = url-test,TWN_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/TW.png
USA = url-test,USA_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/US.png

[Remote Filter]
# > All
ALL_Filter = NameRegex, FilterKey = ".*"

# > Regions
HKG_Filter = NameRegex, FilterKey = "(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)"
JPN_Filter = NameRegex, FilterKey = "(?i)(🇯🇵|日本|东京|東京|大阪|\bJPN\b|\bJP\b|Japan)"
SGP_Filter = NameRegex, FilterKey = "(?i)(🇸🇬|新加坡|狮城|\bSGP\b|\bSG\b|Singapore)"
TWN_Filter = NameRegex, FilterKey = "(?i)(🇹🇼|台湾|台灣|臺灣|\bTWN\b|\bTW\b|Taiwan)"
USA_Filter = NameRegex, FilterKey = "(?i)(🇺🇸|美国|美國|\bUSA\b|\bUS\b|United.?States|America)"

[Remote Rule]
# > Local repo
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/APNs/APNs.list, policy=Manual, tag=APNs, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/Apple-Intelligence/Apple-Intelligence.list, policy=AI, tag=Apple-Intelligence, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/xAI/xAI.list, policy=AI, tag=xAI, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/OpenAI/OpenAI.list, policy=AI, tag=OpenAI, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/GitHub-Copilot/GitHub-Copilot.list, policy=AI, tag=GitHub-Copilot, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/Gemini/Gemini.list, policy=AI, tag=Gemini, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/Anthropic/Anthropic.list, policy=AI, tag=Anthropic, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/IP-Attribution/IP-Attribution.list, policy=IP-Attribution, tag=IP-Attribution, enabled=true
https://github.com/27Aaron/ProxyRules/raw/main/Loon/Rules/GoogleFCM/GoogleFCM.list, policy=Google, tag=GoogleFCM, enabled=true

# > Google / YouTube
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/YouTube/YouTube.list, policy=Google, tag=YouTube, enabled=true
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Google/Google.list, policy=Google, tag=Google, enabled=true
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/GoogleFCM/GoogleFCM.list, policy=Google, tag=GoogleFCM-BM7, enabled=true

# > Apple
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Apple/Apple.list, policy=Apple, tag=Apple, enabled=true

# > Telegram / Twitter
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Telegram/Telegram.list, policy=Telegram, tag=Telegram, enabled=true
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Twitter/Twitter.list, policy=Twitter, tag=Twitter, enabled=true

# > Direct (CN)
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Apple/Apple_CN.list, policy=DIRECT, tag=AppleCN, enabled=true
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Microsoft/Microsoft_CN.list, policy=DIRECT, tag=MicrosoftCN, enabled=true
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/ChinaMax/ChinaMax.list, policy=DIRECT, tag=ChinaMax, enabled=true

# > Proxy fallback
https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/Proxy/Proxy.list, policy=Proxies, tag=Proxy, enabled=true

[Rule]
# > Final
FINAL,Proxies

[Rewrite]
# > Redirect Google Search Service
^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
# > Redirect Google Maps Service
^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

[Script]

[MITM]
hostname =
ca-p12 =
ca-passphrase =
skip-server-cert-verify = false
