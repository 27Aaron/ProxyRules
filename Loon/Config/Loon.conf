[General]
# > Interface
ip-mode = dual
interface-mode = auto

# > skip-proxy / bypass-tun
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96, localhost, *.local, captive.apple.com, e.crashlytics.com
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, ::ffff:0:0:0:0/96

# > DNS
dns-server = system, 223.5.5.5, 119.29.29.29
doh-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
hijack-dns = 8.8.8.8:53, 1.1.1.1:53, 8.8.4.4:53
dns-reject-mode = LOOPBACKIP
domain-reject-mode = DNS

# > Test URL
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 3

# > Other
allow-udp-proxy = true
udp-fallback-mode = REJECT
sni-sniffing = true

# > GeoIP / Parser
geoip-url = https://github.com/Loyalsoldier/geoip/raw/release/Country-without-asn.mmdb
ipasn-url = https://github.com/Loyalsoldier/geoip/raw/release/GeoLite2-ASN.mmdb
resource-parser = https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js

[Proxy]

[Remote Proxy]

[Proxy Group]
# > AI
AI = select,JP,KR,SG,TW,US,url = http://cp.cloudflare.com/generate_204,interval = 600,img-url = https://github.com/Orz-3/mini/raw/master/Color/OpenAI.png

# > Google
Google = url-test,HK,JP,KR,SG,TW,US,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/Google.png

# > Telegram
Telegram = url-test,HK,JP,KR,SG,TW,US,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/Telegram.png

# > Twitter
Twitter = url-test,HK,JP,KR,SG,TW,US,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/x.png

# > Proxies
Proxies = url-test,HK,JP,KR,SG,TW,US,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/Global.png

# > Regions
HK = url-test,HK_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/HK.png
JP = url-test,JP_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/JP.png
KR = url-test,KR_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/KR.png
SG = url-test,SG_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/SG.png
TW = url-test,TW_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/TW.png
US = url-test,US_Filter,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 30,img-url = https://github.com/Orz-3/mini/raw/master/Color/US.png

[Remote Filter]
# > Regions
HK_Filter = NameRegex, FilterKey = "(?i)(🇭🇰|香港|Hong.?Kong|\bHKG\b|\bHK\b)"
JP_Filter = NameRegex, FilterKey = "(?i)(🇯🇵|日本|东京|東京|大阪|Japan|\bJPN\b|\bJP\b)"
KR_Filter = NameRegex, FilterKey = "(?i)(🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul|\bKOR\b|\bKR\b)"
SG_Filter = NameRegex, FilterKey = "(?i)(🇸🇬|新加坡|狮城|Singapore|\bSGP\b|\bSG\b)"
TW_Filter = NameRegex, FilterKey = "(?i)(🇹🇼|台湾|台灣|臺灣|Taiwan|\bTWN\b|\bTW\b)"
US_Filter = NameRegex, FilterKey = "(?i)(🇺🇸|美国|美國|United.?States|America|\bUSA\b|\bUS\b)"

[Remote Rule]
# > LAN
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list, policy=DIRECT, tag=Private, enabled=true

# > AI
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Anthropic/Anthropic.list, policy=AI, tag=Anthropic, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/AppleAI/AppleAI.list, policy=AI, tag=AppleAI, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/Gemini/Gemini.list, policy=AI, tag=Gemini, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GitHubCopilot/GitHubCopilot.list, policy=AI, tag=GitHubCopilot, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/OpenAI/OpenAI.list, policy=AI, tag=OpenAI, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/XAI/XAI.list, policy=AI, tag=XAI, enabled=true

# > Services
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/ApplePush/ApplePush.list, policy=Proxies, tag=Apple-Push, enabled=true
https://raw.githubusercontent.com/27Aaron/ProxyRules/custom/Rules/GoogleFCM/GoogleFCM.list, policy=Google, tag=GoogleFCM, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list, policy=Google, tag=Google, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list, policy=Telegram, tag=Telegram, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list, policy=Twitter, tag=Twitter, enabled=true

# > Direct CN
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list, policy=DIRECT, tag=CN, enabled=true

# > Proxy fallback
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list, policy=Proxies, tag=Proxy, enabled=true

[Rule]
# > Final
FINAL,Proxies

[Rewrite]
# > Redirect Google Search Service
^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
# > Redirect Google Maps Service
^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

[Script]

[MITM]
hostname =
ca-p12 =
ca-passphrase =
skip-server-cert-verify = false
